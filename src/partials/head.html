<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="styles.css" />
<script>
    try {
        if (localStorage.getItem('ceot-dark-mode') === 'true') document.documentElement.classList.add('dark');
    } catch (e) {}
</script>
<link rel="preload" as="image" href="images/ceot-logo.jpg">

<!-- Font Awesome -->

<script src="https://kit.fontawesome.com/86c2fd87c2.js" crossorigin="anonymous" defer></script>

<!-- ~~~~~~~~~~~~ -->

<!-- Google Fonts: Fraunces (headlines) + Inter (text) -->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<!-- ~~~~~~~~~~~~ -->

<link rel="icon" href="images/ceot-logo.jpg" />

<!-- Link previews (WhatsApp, Facebook, LinkedIn, X). Title and description come from this page's
     <title> and meta description; build.mjs fills them in. -->
<link rel="canonical" href="{{pageUrl}}" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{name}}" />
<meta property="og:url" content="{{pageUrl}}" />
<meta property="og:title" content="{{pageTitle}}" />
<meta property="og:description" content="{{pageDescription}}" />
<meta property="og:image" content="{{url}}images/og-image.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="CEOT Sumbak Farms team kneeling with an award-winning buck in Zambia" />
<meta name="twitter:card" content="summary_large_image" />
